<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoon Feedr Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .zhipu-card { background: #ffffff; border: 1px solid #eef2f6; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .agent-status { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 sidebar zhipu-card m-4 flex flex-col">
        <div class="p-6 border-b">
            <h1 class="text-xl font-bold text-blue-600">Spoon Feedr</h1>
            <p class="text-xs text-gray-400">Baby Sitter v2.0</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block p-3 bg-blue-50 text-blue-600 rounded-lg font-medium">Chat</a>
            <a href="#" class="block p-3 text-gray-600 hover:bg-gray-50 rounded-lg">Memory</a>
            <a href="#" class="block p-3 text-gray-600 hover:bg-gray-50 rounded-lg">Projects</a>
        </nav>
        <div class="p-4 border-t">
            <h3 class="text-xs font-bold text-gray-400 uppercase mb-3">Live Agents</h3>
            <div class="space-y-2">
                <div class="flex items-center text-xs">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 agent-status"></span>
                    <span class="text-gray-600">Ollama (llama3.2)</span>
                </div>
                <div class="flex items-center text-xs">
                    <span class="w-2 h-2 bg-gray-300 rounded-full mr-2"></span>
                    <span class="text-gray-400">Jules (idle)</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col m-4 ml-0">
        <!-- Chat Area -->
        <div class="flex-1 zhipu-card overflow-y-auto p-6 space-y-4">
            <div class="flex justify-start">
                <div class="bg-white border p-4 rounded-2xl max-w-lg shadow-sm">
                    <p class="text-sm text-gray-800">Hello! I'm your Spoon Feedr Baby Sitter. How can I help you ship today?</p>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="mt-4">
            <input type="text" placeholder="Type your command..." class="w-full p-4 zhipu-card focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
    </main>

    <!-- Telemetry Sidebar -->
    <aside class="w-80 zhipu-card m-4 ml-0 p-6 flex flex-col">
        <h3 class="text-sm font-bold text-gray-500 uppercase mb-4">Telemetry</h3>
        <div class="flex-1 bg-gray-50 rounded-lg p-3 font-mono text-[10px] overflow-y-auto">
            <p class="text-green-600">[INFO] Baby Sitter daemon active</p>
            <p class="text-blue-600">[INFO] Monitoring /home/jules/repo</p>
            <p class="text-gray-400">[DEBUG] Intent: coding_task</p>
        </div>
    </aside>
</body>
</html>
